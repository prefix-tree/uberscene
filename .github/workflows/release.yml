name: Release

# Publishes a release when its tag is pushed. After the "chore: version packages" pull request (`pnpm changeset
# version`) has merged into main:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# All packages share one version, so one tag names the release; it must match that version and point at a commit on
# main.
#
# npm trusted publishing: each package on npm trusts this workflow file (release.yml in prefix-tree/uberscene), so
# GitHub's OIDC token stands in for an npm token. There is no secret to leak, and npm attaches provenance when a
# maintainer approves the staged version. Renaming this file breaks publishing until the packages' trusted publisher
# settings are updated too. Leave "npm publish" unchecked on those publishers; this workflow only runs
# `npm stage publish`.
#
# A package new to npm (such as @uberscene/sdk) has no trusted publisher until it exists: a maintainer creates it on
# npm and adds this workflow as its trusted publisher before the first release that includes it.
#
# The native codecs are not on npm: the release attaches each platform's binary to its GitHub release, and writes their
# hashes into the render package, which checks a download against them (`uberscene codecs install`).
#
# It can also be run by hand from main (Actions → Release → Run workflow), to retry a release whose tag is already
# pushed: it then stages the version main holds. A version that is staged and not yet approved cannot be staged
# again, and the OIDC token cannot list or reject it. Approve it, or reject it from npmjs.com, before retrying.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  codecs:
    uses: ./.github/workflows/codecs-build.yml

  release:
    needs: codecs
    runs-on: ubuntu-latest
    permissions:
      # Creates the GitHub release and attaches the codec binaries to it.
      contents: write
      # The OIDC token npm exchanges for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to check that the tag is on main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      # No `registry-url`: it writes an .npmrc whose `_authToken=${NODE_AUTH_TOKEN}` is empty here, and npm then sends
      # that instead of doing the OIDC exchange (the registry answers 404).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # `npm stage publish` needs npm 11.15.0 or newer. The OIDC exchange itself exists from 11.5.1.
      - run: npm install -g npm@^11.15.0 && npm --version
      - name: Check the tag against main and the packages' version
        run: |
          version=$(node -p "require('./packages/kit/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::run it from main, not $GITHUB_REF_NAME."
              exit 1
            fi
            tag="v$version"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match the packages' version $version; tag v$version instead."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $tag points at a commit that is not on main."
            exit 1
          fi
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "::error::$pending changeset(s) are pending: run \`pnpm changeset version\` and merge the version pull request before tagging."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:packages
      # The binaries the build jobs made, named as release assets, and their hashes written into the render package
      # before it is packed, so the published package checks what it downloads.
      - uses: actions/download-artifact@v4
        with:
          pattern: codec-*
          path: codec-builds
      - run: node scripts/codec-assets.mjs codec-builds codec-assets
      - name: Attach the codec binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./packages/kit/package.json').version")"
          # The release's notes: .github/releases/<tag>.md when the version pull request wrote one.
          notes=".github/releases/$tag.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --notes "See the packages' CHANGELOG.md files."; fi
          if gh release view "$tag" >/dev/null 2>&1; then gh release edit "$tag" "$@"
          else gh release create "$tag" --verify-tag --title "$tag" "$@"; fi
          gh release upload "$tag" codec-assets/* --clobber
      # Packs each package whose version is not on npm (swapping workspace:* for versions) and runs
      # `npm stage publish` on the tarball. The version stays un-installable until a maintainer approves it
      # with 2FA. The pushed tag names the release, so this makes no git tags of its own.
      - run: pnpm release
