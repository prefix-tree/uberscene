name: Release

# Publishes a release when its tag is pushed. After the "chore: version packages" pull request (`pnpm changeset
# version`) has merged into main:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# All packages share one version, so one tag names the release; it must match that version and point at a commit on
# main.
#
# npm trusted publishing: each package on npm trusts this workflow file (release.yml in prefix-tree/uberscene), so
# GitHub's OIDC token stands in for an npm token. There is no secret to leak, and npm attaches provenance when a
# maintainer approves the staged version. Renaming this file breaks publishing until the packages' trusted publisher
# settings are updated too. Leave "npm publish" unchecked on those publishers; this workflow only runs
# `npm stage publish`.
#
# A package new to npm (such as @uberscene/sdk) has no trusted publisher until it exists: a maintainer creates it on
# npm and adds this workflow as its trusted publisher before the first release that includes it. That goes for
# @uberscene/codecs and each of its platform packages (packages/codecs/targets.json) too.
#
# It can also be run by hand from main (Actions → Release → Run workflow), to retry a release whose tag is already
# pushed: it then stages the version main holds. A version that is staged and not yet approved cannot be staged
# again, and the OIDC token cannot list or reject it. Approve it, or reject it from npmjs.com, before retrying.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  codecs:
    # The native codecs (native/), built once per platform @uberscene/codecs is published for. Each row is a row of
    # packages/codecs/targets.json; each runner is that platform itself, so the binary is run before it is shipped.
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: darwin-arm64, rust: aarch64-apple-darwin, runner: macos-15 }
          - { target: darwin-x64, rust: x86_64-apple-darwin, runner: macos-15-intel }
          # The oldest Ubuntu runners: the binary then runs on any glibc from 2.35 on.
          - { target: linux-x64-gnu, rust: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: linux-arm64-gnu, rust: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: win32-x64, rust: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - run: cargo build --release --locked --target ${{ matrix.rust }} --manifest-path native/Cargo.toml
      - name: Read a clip with it
        shell: bash
        run: |
          bin="native/target/${{ matrix.rust }}/release/uberscene-codec"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" probe docs/public/playground/coffee.webm | grep '"decodable":true'
      - uses: actions/upload-artifact@v4
        with:
          name: codec-${{ matrix.target }}
          path: native/target/${{ matrix.rust }}/release/uberscene-codec*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: codecs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token npm exchanges for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to check that the tag is on main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      # No `registry-url`: it writes an .npmrc whose `_authToken=${NODE_AUTH_TOKEN}` is empty here, and npm then sends
      # that instead of doing the OIDC exchange (the registry answers 404).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # `npm stage publish` needs npm 11.15.0 or newer. The OIDC exchange itself exists from 11.5.1.
      - run: npm install -g npm@^11.15.0 && npm --version
      - name: Check the tag against main and the packages' version
        run: |
          version=$(node -p "require('./packages/kit/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::run it from main, not $GITHUB_REF_NAME."
              exit 1
            fi
            tag="v$version"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match the packages' version $version; tag v$version instead."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $tag points at a commit that is not on main."
            exit 1
          fi
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "::error::$pending changeset(s) are pending: run \`pnpm changeset version\` and merge the version pull request before tagging."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:packages
      # Each platform package gets the binary its build job made; a package without one refuses to pack.
      - uses: actions/download-artifact@v4
        with:
          pattern: codec-*
          path: codec-builds
      - name: Put the codec binaries in their packages
        run: |
          for dir in codec-builds/codec-*; do
            target="${dir#codec-builds/codec-}"
            binary=$(find "$dir" -type f \( -name uberscene-codec -o -name uberscene-codec.exe \) | head -1)
            node packages/codecs/scripts/place.mjs --target "$target" --from "$binary"
          done
      # Packs each package whose version is not on npm (swapping workspace:* for versions) and runs
      # `npm stage publish` on the tarball. The version stays un-installable until a maintainer approves it
      # with 2FA. The pushed tag names the release, so this makes no git tags of its own.
      - run: pnpm release
